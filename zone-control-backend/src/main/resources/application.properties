# ==========================================================================
# APPLICATION PROPERTIES — Zone Control Backend
# Perfil base (sin datasource). Activa con -Dspring.profiles.active=dev o prod
# ==========================================================================

spring.application.name=zone-control

# Servidor
server.port=8080

# JWT
jwt.secret=9a2f8c7e1b4d6a8f3e5c7b9a1f4d6e8c2a5b7e9f1c4d6a8b0e3f5c7b9a1f4d6e
jwt.expiration=28800000

# Logging
logging.level.org.springframework.security=WARN
logging.level.com.laboratorioxyz=DEBUG

# Correo (desactivado en dev, configurar en prod)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:noreply@laboratorioxyz.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true