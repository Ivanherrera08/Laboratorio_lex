# ==========================================================================
# PERFIL: prod — PostgreSQL real
# Uso: ./mvnw spring-boot:run -Dspring-boot.run.profiles=prod
# ==========================================================================

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/zone_control_db?currentSchema=zone_control
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.properties.hibernate.default_schema=zone_control
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway — ejecuta V1__init_schema.sql automáticamente
spring.flyway.enabled=true
spring.flyway.schemas=zone_control
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

spring.sql.init.mode=never

# CORS permitido al frontend Next.js
cors.allowed-origins=http://localhost:3000
