# ==========================================================================
# PERFIL: dev — Base de datos H2 en memoria (sin instalar PostgreSQL)
# Uso: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# ==========================================================================

# H2 en memoria con esquema zone_control creado automáticamente
# INIT ejecuta SQL al arrancar la conexión antes que Hibernate
spring.datasource.url=jdbc:h2:mem:zone_control_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS zone_control;NON_KEYWORDS=VALUE,KEY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate — crea tablas desde entidades automáticamente
spring.jpa.properties.hibernate.default_schema=zone_control
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway DESACTIVADO en dev
spring.flyway.enabled=false

# Datos semilla para dev (se ejecuta después de que Hibernate crea las tablas)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-dev.sql
spring.jpa.defer-datasource-initialization=true

# CORS para el frontend Next.js
cors.allowed-origins=http://localhost:3000
