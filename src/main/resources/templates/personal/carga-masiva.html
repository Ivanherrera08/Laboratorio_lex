<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Carga Masiva de Personal')}"></head>
<body class="bg-brand-light min-h-screen flex">
    <aside th:replace="~{layout/base :: sidebar}"></aside>

    <div class="flex-1 flex flex-col">
        <header class="h-16 bg-white border-b border-brand-accent/20 px-8 flex items-center justify-between">
            <span class="text-xs font-semibold text-brand-text/70">Módulo de Ingesta Masiva • Zone Control</span>
        </header>

        <main class="p-8 max-w-4xl mx-auto w-full space-y-6">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-bold text-brand-dark">Carga Masiva de Personal (CSV)</h1>
                    <p class="text-xs text-brand-text/70">Procesamiento por lotes y validación de inconsistencias.</p>
                </div>
            </div>

            <div class="bg-white rounded-3xl p-8 border border-brand-accent/40 shadow-xs space-y-6">
                <form th:action="@{/personal/cargar-masivo}" method="post" enctype="multipart/form-data" class="space-y-4">
                    <div class="border-2 border-dashed border-brand-accent/80 p-8 rounded-2xl text-center bg-brand-light/40">
                        <p class="text-xs text-brand-dark font-bold mb-2">Seleccione el archivo .CSV a procesar</p>
                        <input type="file" name="file" accept=".csv" required class="text-xs text-brand-text">
                    </div>

                    <button type="submit" class="w-full py-2.5 rounded-xl bg-brand-primary text-white font-semibold text-xs shadow-md">
                        Subir y Procesar Archivo
                    </button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
