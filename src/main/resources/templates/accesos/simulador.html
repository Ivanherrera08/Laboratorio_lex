<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Simulador de Acceso')}"></head>
<body class="bg-brand-light min-h-screen flex">
    <aside th:replace="~{layout/base :: sidebar}"></aside>

    <div class="flex-1 flex flex-col">
        <!-- Top bar -->
        <header class="h-16 bg-white border-b border-brand-accent/20 px-8 flex items-center justify-between">
            <div class="flex items-center gap-2 text-xs font-semibold text-brand-text/70">
                <span class="w-2 h-2 rounded-full bg-status-authorized animate-pulse"></span>
                Control Físico en Línea • Trazabilidad Farmacéutica Activa
            </div>
        </header>

        <main class="p-8 max-w-4xl mx-auto w-full space-y-8">
            <div>
                <h1 class="text-2xl font-bold text-brand-dark">Simulador de Control de Acceso Físico</h1>
                <p class="text-xs text-brand-text/70 mt-1">
                    Validación instantánea de tarjetas RFID y documentos de identidad.
                </p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Formulario -->
                <div class="bg-white rounded-3xl p-6 border border-brand-accent/40 shadow-xs space-y-4">
                    <h2 class="text-sm font-bold text-brand-dark">Lector de Credenciales</h2>

                    <form th:action="@{/simulador/evaluar}" method="post" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-brand-text mb-1">Área Restringida</label>
                            <select name="areaId" class="w-full px-3 py-2 rounded-xl border border-brand-accent/60 text-xs bg-white">
                                <option value="1">Laboratorio de Síntesis Molecular (Alto Riesgo)</option>
                                <option value="2">Sala Limpia de Liofilización (Alto Riesgo)</option>
                                <option value="3">Almacén de Materias Primas (Medio Riesgo)</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-brand-text mb-1">Identificador / Tarjeta RFID</label>
                            <input type="text" name="identificador" required placeholder="Ej. 10123456 o RFID-001"
                                class="w-full px-3.5 py-2 rounded-xl border border-brand-accent/60 text-xs font-mono">
                        </div>

                        <button type="submit" class="w-full py-2.5 rounded-xl bg-brand-primary hover:bg-brand-primary/90 text-white font-semibold text-xs shadow-md">
                            Simular Lectura de Acceso
                        </button>
                    </form>
                </div>

                <!-- Resultado -->
                <div class="bg-white rounded-3xl p-6 border border-brand-accent/40 shadow-xs flex flex-col justify-center text-center">
                    <div th:if="${resultado == null}" class="p-8 border border-dashed border-brand-accent/60 rounded-2xl">
                        <div class="text-3xl mb-2">⚡</div>
                        <p class="text-xs text-brand-text/60">Ingrese los datos para procesar el ingreso</p>
                    </div>

                    <div th:if="${resultado != null}" th:classappend="${resultado.estado == 'AUTORIZADO' ? 'border-[#4A9B8E] bg-emerald-50' : (resultado.estado == 'DENEGADO' ? 'border-[#E8A0A0] bg-red-50' : 'border-[#E8C687] bg-amber-50')}"
                        class="p-6 rounded-2xl border text-center">
                        <h3 class="text-xl font-extrabold" th:text="${resultado.estado}">RESULTADO</h3>
                        <p class="text-xs font-medium mt-2" th:text="${resultado.motivo}">Detalle</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
