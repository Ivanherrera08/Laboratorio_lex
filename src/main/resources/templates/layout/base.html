<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' — Zone Control'">Zone Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/zone-control.css}">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#FFFFFF',
                            secondary: '#EAF5EE',
                            primary: '#6B9B7C',
                            accent: '#A8D5BA',
                            text: '#2E3D34',
                            dark: '#1C2721',
                            light: '#F4FAF6',
                        },
                        status: {
                            authorized: '#4A9B8E',
                            denied: '#E8A0A0',
                            warning: '#E8C687',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-light min-h-screen flex">
    <!-- Sidebar Fragment -->
    <aside th:fragment="sidebar" class="w-64 bg-brand-secondary border-r border-brand-accent/30 flex flex-col justify-between min-h-screen">
        <div>
            <!-- Header -->
            <div class="p-6 border-b border-brand-accent/30">
                <a th:href="@{/simulador}" class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-lg bg-brand-primary flex items-center justify-center text-white font-bold text-lg shadow-sm">
                        Z
                    </div>
                    <div>
                        <span class="font-bold text-lg text-brand-dark tracking-tight">Zone Control</span>
                        <span class="block text-[10px] font-semibold text-brand-primary">Laboratorio XYZ</span>
                    </div>
                </a>
            </div>

            <!-- Menú de Navegación -->
            <nav class="p-4 space-y-1.5 text-xs font-semibold">
                <a th:href="@{/simulador}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-brand-text hover:bg-brand-accent/20">
                    ⚡ Simulador de Acceso
                </a>
                <a th:href="@{/personal}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-brand-text hover:bg-brand-accent/20">
                    👥 Gestión de Personal
                </a>
                <a th:href="@{/personal/carga-masiva}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-brand-text hover:bg-brand-accent/20">
                    📊 Carga Masiva (CSV)
                </a>
                <a th:href="@{/catalogos}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-brand-text hover:bg-brand-accent/20">
                    🏢 Áreas y Catálogos
                </a>
                <a th:href="@{/historial}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-brand-text hover:bg-brand-accent/20">
                    📋 Historial de Accesos
                </a>
                <a th:href="@{/socio-sync}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-brand-text hover:bg-brand-accent/20">
                    🌐 Socio Internacional
                </a>
                <a th:href="@{/auditoria}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-brand-text hover:bg-brand-accent/20">
                    🛡️ Bitácora de Auditoría
                </a>
            </nav>
        </div>

        <div class="p-4 border-t border-brand-accent/30">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="w-full text-left px-3.5 py-2 rounded-lg text-xs font-semibold text-red-600 hover:bg-red-50">
                    🚪 Cerrar Sesión
                </button>
            </form>
        </div>
    </aside>
</body>
</html>
